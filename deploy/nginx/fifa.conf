# Mandrake FIFA Predictor — Nginx (Amazon Linux 2023)
#
# No custom domain? On EC2 run:
#   bash deploy/configure-nginx-host.sh
# (sets server_name to e.g. 54-123-45-67.sslip.io from your Elastic IP)
#
# Custom domain: replace YOUR_DOMAIN.com below, or:
#   sudo cp deploy/nginx/fifa.conf /etc/nginx/conf.d/fifa.conf
#
# Then HTTPS:
#   sudo certbot --nginx -d YOUR_DOMAIN.com

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.com;

    root /opt/fifaPrediction/frontend/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
